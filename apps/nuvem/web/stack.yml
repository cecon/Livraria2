# Compose do ambiente web local/prod-local e Dokploy.
# As imagens sao publicadas no GHCR pelo workflow `.github/workflows/web-images.yml`.
# O banco oficial deste stack e o Postgres local `db`, com volume persistente.

services:
  db:
    image: postgres:16-alpine
    container_name: livraria-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: livraria
      POSTGRES_USER: livraria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - livraria_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livraria -d livraria"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  api:
    image: ghcr.io/cecon/livraria2-nuvem-api:latest
    container_name: livraria-nuvem-api
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      API_OPERATIONS_ENABLED: "true"
      DATABASE_URL: postgresql://livraria:${POSTGRES_PASSWORD}@db:5432/livraria?schema=public
      API_JWT_SECRET: ${API_JWT_SECRET}
      LLM_ENCRYPTION_KEY: ${LLM_ENCRYPTION_KEY:-}
      LLM_ALLOWED_BASE_URLS: ${LLM_ALLOWED_BASE_URLS:-}
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  migrator:
    image: ghcr.io/cecon/livraria2-migrator:latest
    container_name: livraria-migrator
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://livraria:${POSTGRES_PASSWORD}@db:5432/livraria?schema=public
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  escritorio:
    image: ghcr.io/cecon/livraria2-escritorio:latest
    container_name: livraria-escritorio
    restart: unless-stopped
    ports:
      - "${ESCRITORIO_PORT:-47612}:3000"
    environment:
      NUVEM_API_URL: http://api:3001
      NODE_ENV: production
    depends_on:
      - api
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: livraria-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOCKER_API_VERSION: "1.40"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_INCLUDE_RESTARTING: "true"

volumes:
  livraria_postgres_data:
